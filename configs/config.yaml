# Data configuration
data:
  raw_dir: "data/raw"
  processed_dir: "data/processed"
  external_dir: "data/external"
  
  # Synthetic data parameters
  n_samples: 1000
  random_seed: 42
  
  # Feature engineering
  features:
    ndvi_change:
      mean: -0.1
      std: 0.2
    surface_temp_rise:
      mean: 1.5
      std: 0.5
    logging_index:
      mean: 0.4
      std: 0.3
    days_since_rain:
      mean: 15
      std: 5
    distance_to_road:
      mean: 5
      std: 2
  
  # Deforestation criteria
  deforestation_thresholds:
    ndvi_change: -0.2
    logging_index: 0.5
    days_since_rain: 10
    distance_to_road: 6

# Model configuration
model:
  # Device selection (CUDA -> MPS -> CPU)
  device: "auto"
  
  # Model types to train
  models:
    - "xgboost"
    - "lightgbm"
    - "neural_network"
    - "spatial_ml"
  
  # Neural network architecture
  neural_network:
    hidden_layers: [64, 32]
    activation: "relu"
    dropout: 0.2
    epochs: 50
    batch_size: 32
    learning_rate: 0.001
  
  # XGBoost parameters
  xgboost:
    n_estimators: 100
    max_depth: 6
    learning_rate: 0.1
    subsample: 0.8
    colsample_bytree: 0.8
  
  # LightGBM parameters
  lightgbm:
    n_estimators: 100
    max_depth: 6
    learning_rate: 0.1
    subsample: 0.8
    colsample_bytree: 0.8

# Evaluation configuration
evaluation:
  test_size: 0.2
  cv_folds: 5
  random_seed: 42
  
  # Metrics to compute
  metrics:
    classification:
      - "accuracy"
      - "precision"
      - "recall"
      - "f1"
      - "roc_auc"
      - "pr_auc"
    spatial:
      - "iou"
      - "dice"
      - "morans_i"

# Visualization configuration
visualization:
  figure_size: [12, 8]
  dpi: 300
  style: "seaborn-v0_8"
  
  # Map configuration
  map:
    center_lat: 0.0
    center_lon: 0.0
    zoom: 2
    tiles: "OpenStreetMap"
  
  # Color schemes
  colors:
    forest_intact: "#228B22"
    forest_deforested: "#8B0000"
    prediction: "#FFD700"
    uncertainty: "#FFA500"

# Logging configuration
logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file: "logs/deforestation_monitoring.log"
